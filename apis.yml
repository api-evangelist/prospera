name: Prospera
description: 'Prospera Technologies was an Israeli agricultural-technology company, founded in 2014 and
  headquartered in Tel Aviv with US offices in Austin, TX, that applied machine learning and computer
  vision to continuously monitor plant development, health and stress from crop-field imagery and deliver
  irrigation and crop-growth recommendations to growers through mobile and web dashboards. Backed by
  Bessemer Venture Partners, Cisco and Qualcomm, Prospera was acquired by Valmont Industries for roughly
  $300M in 2021 and its technology was folded into Valmont''s Valley Insights and the Valley 365 connected
  crop-management platform. Prospera no longer operates an independent public developer surface: the
  prospera.ag domain still resolves in DNS but its HTTPS endpoint is unreachable, and no public API,
  developer portal, or API documentation was found during enrichment.'
